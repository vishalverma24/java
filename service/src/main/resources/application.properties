spring.application.name=service
server.port=8080

# No config server is used yet; without this, spring-cloud-starter-config fails startup
spring.cloud.config.enabled=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/service?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
